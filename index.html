<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>泡泡會員社群・入群驗證</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--ink:#1f2937;--mute:#6b7280;--line:#e5e7eb;--brand:#06c755;--brand-d:#05a948;--err:#dc2626;--warn-bg:#fff8e1;--r:14px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:24px 16px 48px}
  header{text-align:center;margin-bottom:20px}
  .badge{display:inline-flex;align-items:center;gap:6px;background:#e8f9ef;color:var(--brand-d);font-size:13px;font-weight:600;padding:4px 12px;border-radius:99px}
  h1{font-size:24px;margin:12px 0 6px;letter-spacing:.02em}
  header p{margin:0;color:var(--mute);font-size:14px}
  .card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);margin-bottom:16px}
  .howto{background:var(--warn-bg);border-radius:var(--r);padding:14px 16px;font-size:14px;margin-bottom:16px}
  .howto b{display:block;margin-bottom:4px}
  .howto ol{margin:0;padding-left:20px}
  label.f{display:block;font-weight:600;font-size:15px;margin:18px 0 6px}
  label.f:first-child{margin-top:0}
  label.f small{font-weight:400;color:var(--mute);margin-left:4px}
  .req{color:var(--err)}
  input[type=text],input[type=date],input[type=datetime-local]{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:inherit;appearance:none;-webkit-appearance:none;min-height:48px}
  input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(6,199,85,.15)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row label.f{margin-top:18px}
  .hint{font-size:13px;color:var(--mute);margin-top:4px}
  .drop{position:relative;border:2px dashed #cbd5e1;border-radius:12px;padding:24px 16px;text-align:center;cursor:pointer;transition:.15s;background:#fafbfc}
  .drop:hover,.drop.over{border-color:var(--brand);background:#f0fbf4}
  .drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .drop .ic{font-size:30px;line-height:1;color:#94a3b8}
  .drop .t{font-weight:600;margin-top:6px}
  .preview{display:none;margin-top:12px;position:relative}
  .preview img{width:100%;max-height:420px;object-fit:contain;border-radius:10px;background:#f1f5f9;border:1px solid var(--line)}
  .preview button{position:absolute;top:8px;right:8px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer}
  .agree{display:flex;gap:10px;align-items:flex-start;margin-top:20px;font-size:14px;color:#374151}
  .agree input{width:20px;height:20px;margin-top:2px;accent-color:var(--brand);flex:none}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .btn{width:100%;margin-top:20px;border:0;border-radius:12px;background:var(--brand);color:#fff;font:600 17px/1 inherit;font-family:inherit;padding:16px;cursor:pointer;transition:.15s}
  .btn:hover{background:var(--brand-d)}
  .btn:disabled{background:#9ca3af;cursor:wait}
  .err{display:none;margin-top:14px;padding:12px 14px;border-radius:10px;background:#fdecec;color:var(--err);font-size:14px}
  .done{display:none;text-align:center;padding:36px 20px}
  .done .ok{width:64px;height:64px;border-radius:50%;background:#e8f9ef;color:var(--brand-d);display:grid;place-items:center;margin:0 auto 12px;font-size:32px}
  .done .id{display:inline-block;font:700 28px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;background:#f1f5f9;padding:12px 20px;border-radius:10px;margin:12px 0}
  .done p{color:var(--mute);margin:6px 0}
  footer{text-align:center;color:#9ca3af;font-size:12px;margin-top:8px}
  @media (max-width:420px){.row{grid-template-columns:1fr;gap:0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">● 付費會員驗證</span>
    <h1>泡泡會員社群・入群驗證</h1>
    <p>本社群僅限有訂閱泡泡的成員加入，請上傳含名字浮水印的付費截圖完成驗證。</p>
  </header>

  <div id="formView">
    <div class="howto">
      <b>付費截圖怎麼準備？</b>
      <ol>
        <li>在泡泡 App 截下「訂閱／付費成功」畫面（需看得到日期）</li>
        <li>用相簿編輯或任何 App，在截圖上加上你的<strong>社群名字</strong>文字浮水印</li>
        <li>名字需與下方填寫的社群名字一致，否則無法通過審核</li>
      </ol>
    </div>

    <form class="card" id="form" novalidate>
      <label class="f" for="name">社群名字 <span class="req">*</span><small>你在 LINE 社群中顯示的名字</small></label>
      <input type="text" id="name" maxlength="50" autocomplete="off" placeholder="例：小星星🌟" required>

      <div class="row">
        <div>
          <label class="f" for="payDate">泡泡付費日期 <span class="req">*</span></label>
          <input type="date" id="payDate" required>
        </div>
        <div>
          <label class="f" for="expireDate">泡泡訂閱到期日 <span class="req">*</span></label>
          <input type="date" id="expireDate" required>
        </div>
      </div>

      <label class="f" for="joinTime">加入 LINE 社群的時間 <span class="req">*</span></label>
      <input type="datetime-local" id="joinTime" required>
      <div class="hint">大約時間即可，方便管理員比對社群的加入通知</div>

      <label class="f">付費截圖（含名字浮水印）<span class="req">*</span></label>
      <div class="drop" id="drop">
        <input type="file" id="file" accept="image/jpeg,image/png,image/webp">
        <div class="ic">⇪</div>
        <div class="t">點擊選擇圖片</div>
        <div class="hint">支援 JPG／PNG，圖片會自動壓縮</div>
      </div>
      <div class="preview" id="preview"><img id="previewImg" alt="截圖預覽"><button type="button" id="clearImg">重新選擇</button></div>

      <div class="hp" aria-hidden="true"><input type="text" id="website" tabindex="-1" autocomplete="off"></div>

      <label class="agree"><input type="checkbox" id="agree"><span>我確認以上資料與截圖皆為本人真實資料，並同意僅供本社群審核使用。</span></label>

      <button class="btn" id="submit" type="submit">送出驗證</button>
      <div class="err" id="err"></div>
    </form>
  </div>

  <div class="card done" id="doneView">
    <div class="ok">✓</div>
    <h2 style="margin:0">已收到你的驗證資料</h2>
    <p>你的申請編號</p>
    <div class="id" id="doneId">—</div>
    <p>管理員審核後會處理你的入群狀態，<br>若有問題請提供此編號給管理員。</p>
  </div>

  <footer>資料僅供社群管理員審核使用</footer>
</div>

<script>
  /* ===== 請把下面網址換成你的 Apps Script 部署網址（結尾 /exec） ===== */
  const API_URL = 'https://script.google.com/macros/s/AKfycby0IsoW876u1UEtO2lL2AhUz2n7tlQOuwK1sbZjUnymgjcI_lK-kW9b80c1soer0gJfFQ/exec';

  // 以 text/plain 送出可避免跨網域預檢；不帶 Google 登入狀態，所以多帳號也能用
  async function api(action, payload) {
    let res;
    try {
      res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action }, payload)),
      });
    } catch (e) { throw new Error('連線失敗，請檢查網路後再試'); }
    let json;
    try { json = await res.json(); } catch (e) { throw new Error('伺服器回應異常，請確認部署設定'); }
    if (!json.ok) throw new Error(String(json.error || '發生錯誤').replace(/^Error:\s*/, ''));
    return json.result;
  }

  const $ = id => document.getElementById(id);
  const MAX_SIDE = 1600;
  let imageData = '';

  // 預設日期上限：不能選未來日期
  const pad = n => String(n).padStart(2, '0');
  const now = new Date();
  const todayStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  $('payDate').max = todayStr;
  $('expireDate').min = todayStr;
  $('joinTime').max = `${todayStr}T23:59`;

  // 圖片選擇與壓縮
  const drop = $('drop');
  ['dragenter','dragover'].forEach(e => drop.addEventListener(e, () => drop.classList.add('over')));
  ['dragleave','drop'].forEach(e => drop.addEventListener(e, () => drop.classList.remove('over')));
  $('file').addEventListener('change', e => handleFile(e.target.files[0]));
  $('clearImg').addEventListener('click', () => {
    imageData = ''; $('file').value = '';
    $('preview').style.display = 'none'; drop.style.display = 'block';
  });

  function handleFile(file) {
    if (!file) return;
    if (!/^image\//.test(file.type)) return showErr('請選擇圖片檔（JPG／PNG）');
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      imageData = c.toDataURL('image/jpeg', 0.88);
      URL.revokeObjectURL(url);
      $('previewImg').src = imageData;
      $('preview').style.display = 'block'; drop.style.display = 'none';
      hideErr();
    };
    img.onerror = () => { URL.revokeObjectURL(url); showErr('無法讀取這張圖片，請改用 JPG 或 PNG 格式（iPhone 可先截圖再上傳）'); };
    img.src = url;
  }

  // 送出
  $('form').addEventListener('submit', e => {
    e.preventDefault();
    hideErr();
    const d = {
      name: $('name').value.trim(),
      payDate: $('payDate').value,
      expireDate: $('expireDate').value,
      joinTime: $('joinTime').value,
      image: imageData,
      website: $('website').value,
    };
    if (!d.name) return showErr('請填寫社群名字', 'name');
    if (!d.payDate) return showErr('請填寫泡泡付費日期', 'payDate');
    if (!d.expireDate) return showErr('請填寫泡泡訂閱到期日', 'expireDate');
    if (d.expireDate < d.payDate) return showErr('到期日不能早於付費日期', 'expireDate');
    if (d.expireDate < todayStr) return showErr('你的泡泡訂閱已到期，請續訂後再提交', 'expireDate');
    if (!d.joinTime) return showErr('請填寫加入 LINE 社群的時間', 'joinTime');
    if (!d.image) return showErr('請上傳含名字浮水印的付費截圖');
    if (!$('agree').checked) return showErr('請勾選確認資料真實');

    const btn = $('submit');
    btn.disabled = true; btn.textContent = '上傳中，請稍候…';
    api('submit', { data: d })
      .then(res => {
        $('doneId').textContent = res.id;
        $('formView').style.display = 'none';
        $('doneView').style.display = 'block';
        window.scrollTo(0, 0);
      })
      .catch(err => {
        btn.disabled = false; btn.textContent = '送出驗證';
        showErr(err.message || '送出失敗，請稍後再試');
      });
  });

  function showErr(msg, focusId) {
    const el = $('err'); el.textContent = msg; el.style.display = 'block';
    if (focusId) $(focusId).focus();
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function hideErr() { $('err').style.display = 'none'; }
</script>
</body>
</html>
