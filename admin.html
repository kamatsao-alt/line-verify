<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>審核後台｜泡泡會員社群・入群驗證</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#f5f6f8;--card:#fff;--ink:#1f2937;--mute:#6b7280;--line:#e5e7eb;--brand:#06c755;--brand-d:#05a948;
    --ok:#15803d;--ok-bg:#e7f6ec;--no:#dc2626;--no-bg:#fdecec;--pend:#b45309;--pend-bg:#fff4dc;--exp:#6b21a8;--exp-bg:#f3e8ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
  button{font:inherit;cursor:pointer}
  input,textarea{font:inherit;color:inherit}
  /* login */
  #login{min-height:100vh;display:grid;place-items:center;padding:16px}
  .login-card{background:var(--card);width:100%;max-width:360px;padding:28px 24px;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.08);text-align:center}
  .login-card h1{font-size:20px;margin:0 0 4px}
  .login-card p{color:var(--mute);margin:0 0 20px;font-size:14px}
  .inp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;min-height:46px}
  .inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(6,199,85,.15)}
  .btn{border:0;border-radius:10px;padding:12px 18px;font-weight:600;background:var(--ink);color:#fff}
  .btn.full{width:100%;margin-top:12px}
  .btn:disabled{opacity:.5;cursor:wait}
  .msg{color:var(--no);font-size:14px;margin-top:10px;min-height:20px}
  /* app */
  #app{display:none;max-width:1200px;margin:0 auto;padding:20px 16px 48px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .top h1{font-size:20px;margin:0}
  .top .sub{color:var(--mute);font-size:13px}
  .ghost{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;color:var(--ink)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .stat{background:var(--card);border-radius:14px;padding:14px 16px;border:2px solid transparent;text-align:left;color:inherit}
  .stat.on{border-color:var(--ink)}
  .stat .n{font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
  .stat .l{font-size:13px;color:var(--mute)}
  .stat.pend .n{color:var(--pend)} .stat.ok .n{color:var(--ok)} .stat.no .n{color:var(--no)} .stat.exp .n{color:var(--exp)}
  .bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .bar .inp{flex:1;min-width:200px;background:#fff}
  .tab{background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 14px;color:var(--mute)}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .item{background:var(--card);border-radius:14px;padding:16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .item .h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .item .name{font-weight:700;font-size:16px;word-break:break-all}
  .item .id{font:12px ui-monospace,Menlo,monospace;color:var(--mute)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px}
  .kv dt{color:var(--mute)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
  .pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
  .pill.待審核{background:var(--pend-bg);color:var(--pend)} .pill.通過{background:var(--ok-bg);color:var(--ok)} .pill.拒絕{background:var(--no-bg);color:var(--no)}
  .pill.expired{background:var(--exp-bg);color:var(--exp)}
  .warn{font-size:12px;background:#fff4dc;color:#92400e;padding:6px 10px;border-radius:8px}
  .note{font-size:12px;color:var(--mute);border-left:3px solid var(--line);padding-left:8px}
  .item .act{margin-top:auto;padding-top:4px}
  .item .act button{width:100%;border:1px solid var(--line);background:#fafbfc;border-radius:10px;padding:9px;font-weight:600}
  .item .act button:hover{background:#f1f5f9}
  .empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:48px 0}
  /* modal */
  .mask{display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:10;padding:16px;overflow:auto}
  .modal{background:#fff;border-radius:16px;max-width:980px;margin:2vh auto;display:grid;grid-template-columns:1.3fr 1fr;overflow:hidden}
  .modal .img{background:#0f172a;display:grid;place-items:center;min-height:360px;max-height:86vh;overflow:auto}
  .modal .img img{max-width:100%;display:block;cursor:zoom-in}
  .modal .img img.zoom{max-width:none;cursor:zoom-out}
  .modal .img .loading{color:#94a3b8}
  .modal .side{padding:20px;display:flex;flex-direction:column;gap:12px}
  .modal .side h2{margin:0;font-size:20px;word-break:break-all}
  .check{background:#f8fafc;border-radius:10px;padding:10px 12px;font-size:13px}
  .check b{display:block;margin-bottom:2px}
  .check ul{margin:0;padding-left:18px}
  textarea{width:100%;min-height:70px;border:1.5px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .a-ok{background:var(--ok);color:#fff;border:0;border-radius:10px;padding:12px;font-weight:700}
  .a-no{background:var(--no);color:#fff;border:0;border-radius:10px;padding:12px;font-weight:700}
  .a-reset{grid-column:1/-1;background:none;border:0;color:var(--mute);text-decoration:underline;padding:4px}
  .close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:#fff;font-size:20px;line-height:1}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;display:none;z-index:20}
  @media (max-width:760px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .modal{grid-template-columns:1fr}
    .modal .img{max-height:60vh}
  }
</style>
</head>
<body>

<section id="login">
  <form class="login-card" id="loginForm">
    <h1>審核後台</h1>
    <p>泡泡會員社群・入群驗證</p>
    <input class="inp" type="password" id="pw" placeholder="管理員密碼" autocomplete="current-password">
    <button class="btn full" id="loginBtn">登入</button>
    <div class="msg" id="loginMsg"></div>
  </form>
</section>

<section id="app">
  <div class="top">
    <div>
      <h1>入群審核</h1>
      <div class="sub" id="updated"></div>
    </div>
    <button class="ghost" id="refresh">↻ 重新整理</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="bar">
    <input class="inp" id="q" placeholder="搜尋社群名字或編號…">
  </div>

  <div class="list" id="list"></div>
</section>

<div class="mask" id="mask">
  <div style="position:relative">
    <div class="modal">
      <div class="img" id="mImg"></div>
      <div class="side">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap" id="mPills"></div>
        <h2 id="mName"></h2>
        <dl class="kv" id="mKv"></dl>
        <div id="mWarn"></div>
        <div class="check">
          <b>審核檢查</b>
          <ul>
            <li>浮水印名字與「社群名字」一致</li>
            <li>截圖為泡泡付費／訂閱成功畫面</li>
            <li>截圖日期與填寫的付費日期相符</li>
            <li>社群內確實有此名字的成員</li>
          </ul>
        </div>
        <textarea id="mNote" placeholder="審核備註（選填，例：浮水印不清楚）"></textarea>
        <div class="acts">
          <button class="a-ok" data-s="通過">通過</button>
          <button class="a-no" data-s="拒絕">拒絕</button>
          <button class="a-reset" data-s="待審核">改回待審核</button>
        </div>
      </div>
    </div>
    <button class="close" id="mClose" aria-label="關閉">×</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  /* ===== 請把下面網址換成你的 Apps Script 部署網址（結尾 /exec） ===== */
  const API_URL = 'https://script.google.com/macros/s/AKfycby0IsoW876u1UEtO2lL2AhUz2n7tlQOuwK1sbZjUnymgjcI_lK-kW9b80c1soer0gJfFQ/exec';

  // 以 text/plain 送出可避免跨網域預檢；不帶 Google 登入狀態，所以多帳號也能用
  async function api(action, payload) {
    let res;
    try {
      res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action }, payload)),
      });
    } catch (e) { throw new Error('連線失敗，請檢查網路後再試'); }
    const text = await res.text();
    let json;
    try { json = JSON.parse(text); } catch (e) {
      const msg = text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 200);
      throw new Error('伺服器回應異常（HTTP ' + res.status + '）：' + (msg || '空白回應'));
    }
    if (!json.ok) throw new Error(String(json.error || '發生錯誤').replace(/^Error:\s*/, ''));
    return json.result;
  }

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pad = n => String(n).padStart(2, '0');
  const d0 = new Date();
  const TODAY = `${d0.getFullYear()}-${pad(d0.getMonth()+1)}-${pad(d0.getDate())}`;

  let PW = '', rows = [], filter = '待審核', current = null;
  const imgCache = {};

  const call = (fn, pw, ...a) => api(fn,
    fn === 'adminImage' ? { pw, fileId: a[0], part: a[1] } :
    fn === 'adminUpdate' ? { pw, id: a[0], status: a[1], note: a[2] } : { pw });

  const isExpired = r => r.status === '通過' && r.expireDate && r.expireDate < TODAY;

  /* 登入 */
  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('loginBtn'); btn.disabled = true; $('loginMsg').textContent = '';
    try {
      PW = $('pw').value;
      rows = await call('adminList', PW);
      $('login').style.display = 'none'; $('app').style.display = 'block';
      stamp(); render();
    } catch (err) { $('loginMsg').textContent = err.message; }
    btn.disabled = false;
  });

  $('refresh').addEventListener('click', async () => {
    $('refresh').disabled = true;
    try { rows = await call('adminList', PW); stamp(); render(); toast('已更新'); }
    catch (err) { toast(err.message); }
    $('refresh').disabled = false;
  });
  $('q').addEventListener('input', render);

  function stamp() { const t = new Date(); $('updated').textContent = `最後更新 ${pad(t.getHours())}:${pad(t.getMinutes())}`; }

  /* 畫面 */
  function render() {
    const cnt = { '待審核': 0, '通過': 0, '拒絕': 0, '已到期': 0, '全部': rows.length };
    rows.forEach(r => { cnt[r.status] = (cnt[r.status] || 0) + 1; if (isExpired(r)) cnt['已到期']++; });
    const defs = [['待審核','pend'],['通過','ok'],['拒絕','no'],['已到期','exp']];
    $('stats').innerHTML = defs.map(([k, c]) =>
      `<button class="stat ${c} ${filter===k?'on':''}" data-f="${k}"><div class="n">${cnt[k]}</div><div class="l">${k}</div></button>`).join('')
      ;
    document.querySelectorAll('.stat').forEach(b => b.onclick = () => { filter = filter === b.dataset.f ? '全部' : b.dataset.f; render(); });

    const q = $('q').value.trim().toLowerCase();
    const list = rows.filter(r => {
      if (filter === '已到期' ? !isExpired(r) : filter !== '全部' && r.status !== filter) return false;
      return !q || r.name.toLowerCase().includes(q) || r.id.toLowerCase().includes(q);
    });
    // 待審核依提交時間由舊到新，方便依序處理
    if (filter === '待審核') list.reverse();

    const label = filter === '全部' ? `全部 ${list.length} 筆（點上方數字可篩選）` : '';
    $('list').innerHTML = list.length ? list.map(card).join('') :
      `<div class="empty">${filter === '待審核' && !q ? '目前沒有待審核的申請 🎉' : '沒有符合的資料'}</div>`;
    if (label) $('list').insertAdjacentHTML('afterbegin', `<div class="empty" style="padding:0 0 4px;text-align:left">${label}</div>`);
    document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openModal(b.dataset.open));
  }

  function card(r) {
    return `<div class="item">
      <div class="h"><div><div class="name">${esc(r.name)}</div><div class="id">${esc(r.id)}・${esc(r.submitted)}</div></div>
        <div style="display:flex;gap:4px;flex-direction:column;align-items:flex-end"><span class="pill ${esc(r.status)}">${esc(r.status)}</span>${isExpired(r)?'<span class="pill expired">已到期</span>':''}</div></div>
      <dl class="kv"><dt>付費日期</dt><dd>${esc(r.payDate)}</dd><dt>到期日</dt><dd>${esc(r.expireDate)}</dd><dt>加入社群</dt><dd>${esc(r.joinTime)}</dd></dl>
      ${r.warn ? `<div class="warn">⚠ ${esc(r.warn)}</div>` : ''}
      ${r.note ? `<div class="note">${esc(r.note)}</div>` : ''}
      <div class="act"><button data-open="${esc(r.id)}">${r.status === '待審核' ? '開始審核' : '查看'}</button></div>
    </div>`;
  }

  /* 審核視窗 */
  async function openModal(id) {
    current = rows.find(r => r.id === id); if (!current) return;
    const r = current;
    $('mPills').innerHTML = `<span class="pill ${esc(r.status)}">${esc(r.status)}</span>${isExpired(r)?'<span class="pill expired">已到期</span>':''}<span class="id" style="font:12px ui-monospace,monospace;color:#6b7280">${esc(r.id)}</span>`;
    $('mName').textContent = r.name;
    $('mKv').innerHTML = `<dt>付費日期</dt><dd>${esc(r.payDate)}</dd><dt>到期日</dt><dd>${esc(r.expireDate)}</dd><dt>加入社群</dt><dd>${esc(r.joinTime)}</dd><dt>提交時間</dt><dd>${esc(r.submitted)}</dd>${r.reviewedAt?`<dt>審核時間</dt><dd>${esc(r.reviewedAt)}</dd>`:''}`;
    $('mWarn').innerHTML = r.warn ? `<div class="warn">⚠ ${esc(r.warn)}</div>` : '';
    $('mNote').value = r.note || '';
    $('mask').style.display = 'block'; document.body.style.overflow = 'hidden';

    const box = $('mImg');
    if (imgCache[r.fileId]) return showImg(imgCache[r.fileId]);
    box.innerHTML = '<div class="loading">載入截圖中…</div>';
    try {
      let first = await call('adminImage', PW, r.fileId, 0), b64 = first.data;
      for (let p = 1; p < first.total; p++) {
        if (!current || current.id !== id) return;
        box.innerHTML = `<div class="loading">載入截圖中… ${Math.round(p / first.total * 100)}%</div>`;
        b64 += (await call('adminImage', PW, r.fileId, p)).data;
      }
      const data = `data:${first.mime};base64,${b64}`;
      imgCache[r.fileId] = data;
      if (current && current.id === id) showImg(data);
    } catch (err) { box.innerHTML = `<div class="loading">${esc(err.message)}</div>`; }
  }
  function showImg(src) {
    $('mImg').innerHTML = `<img src="${src}" alt="付費截圖">`;
    const img = $('mImg').querySelector('img');
    img.onclick = () => img.classList.toggle('zoom');
  }
  function closeModal() { $('mask').style.display = 'none'; document.body.style.overflow = ''; current = null; }
  $('mClose').onclick = closeModal;
  $('mask').addEventListener('click', e => { if (e.target === $('mask')) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && current) closeModal(); });

  document.querySelectorAll('.acts button').forEach(b => b.onclick = async () => {
    if (!current) return;
    const status = b.dataset.s;
    if (status === '拒絕' && !$('mNote').value.trim() && !confirmReject()) return;
    const id = current.id, wasPending = current.status === '待審核';
    document.querySelectorAll('.acts button').forEach(x => x.disabled = true);
    try {
      const upd = await call('adminUpdate', PW, id, status, $('mNote').value.trim());
      rows = rows.map(r => r.id === id ? upd : r);
      toast(`${upd.name}：${status}`);
      // 待審核模式下自動跳到下一筆
      const next = filter === '待審核' && wasPending
        ? rows.slice().reverse().find(r => r.status === '待審核' && r.id !== id) : null;
      render();
      next ? openModal(next.id) : closeModal();
    } catch (err) { toast(err.message); }
    document.querySelectorAll('.acts button').forEach(x => x.disabled = false);
  });

  let rejectArmed = false;
  function confirmReject() {
    if (rejectArmed) { rejectArmed = false; return true; }
    rejectArmed = true; toast('建議填寫拒絕原因；再按一次「拒絕」直接送出');
    setTimeout(() => rejectArmed = false, 4000);
    return false;
  }

  let tt;
  function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', 2600); }
</script>
</body>
</html>
